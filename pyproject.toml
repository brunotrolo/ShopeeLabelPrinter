[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-label-printer"
version = "0.4.0"
description = "Print Shopee shipping labels directly to thermal printer in RAW mode, preserving full resolution"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bruno Trolo", email = "bruno@trolo.dev"}
]
keywords = ["shopee", "printer", "thermal", "labels", "zpl", "tspl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=5.0",
]

[project.urls]
Repository = "https://github.com/brunotrolo/Shopee_Printer"
Issues = "https://github.com/brunotrolo/Shopee_Printer/issues"

[tool.setuptools]
packages = ["shopee_label_printer"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
