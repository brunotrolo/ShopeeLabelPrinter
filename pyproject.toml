[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-label-printer"
version = "0.5.0"
description = "Print Shopee shipping labels directly to thermal printer in RAW mode, preserving full resolution"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bruno Trolo", email = "bruno@trolo.dev"}
]
keywords = ["shopee", "printer", "thermal", "labels", "zpl", "tspl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
lint = [
    "ruff>=0.1",
]
typecheck = [
    "mypy>=1.0",
]
build = [
    "pyinstaller>=5.0",
]

[project.urls]
Repository = "https://github.com/brunotrolo/Shopee_Printer"
Issues = "https://github.com/brunotrolo/Shopee_Printer/issues"

[tool.setuptools]
packages = ["shopee_label_printer"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = [
    "^tests/",
    "^build/",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "W"]
extend-ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
