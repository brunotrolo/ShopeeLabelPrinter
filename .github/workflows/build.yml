name: Build Executável

on:
  # Quando uma tag v* nova é enviada (ex: v0.3.1)
  push:
    tags:
      - 'v*'
  # Quando uma Release é publicada pelo site.
  # Necessário porque apagar uma Release NÃO apaga a tag: ao recriar a Release
  # reaproveitando a tag que sobrou, o GitHub não dispara evento de push e o
  # build nunca rodaria — a Release ficaria publicada e sem o .exe anexado.
  release:
    types: [published]
  # Permite gerar o .exe pelo botão "Run workflow" na aba Actions,
  # sem precisar criar tag nem usar o terminal.
  workflow_dispatch:

# Necessário para o passo de Release conseguir publicar o .exe.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executável
        run: |
          # run_app.py (e não __main__.py): o PyInstaller roda o arquivo de
          # entrada como script solto, e o __main__.py usa import relativo.
          # --paths src deixa o analisador achar o pacote shopee_label_printer.
          $args = @("--onefile", "--windowed", "--name", "ShopeeLabelPrinter", "--paths", "src")
          if (Test-Path "src/shopee_label_printer/assets/icon.ico") {
            $args += @("--icon=src/shopee_label_printer/assets/icon.ico")
          }
          if (Test-Path "file_version_info.txt") {
            $args += @("--version-file=file_version_info.txt")
          }
          $args += "run_app.py"
          pyinstaller @args

      - name: Test executável
        run: |
          if (Test-Path "dist/ShopeeLabelPrinter.exe") {
            $size = [math]::Round((Get-Item "dist/ShopeeLabelPrinter.exe").Length / 1MB, 1)
            Write-Host "✓ Executável criado com sucesso ($size MB)"
          } else {
            throw "Executável não foi criado"
          }

      # Sempre anexa o .exe à execução, para poder baixar direto da aba
      # Actions mesmo quando não há tag/Release.
      - name: Anexar .exe à execução
        uses: actions/upload-artifact@v7
        with:
          name: ShopeeLabelPrinter-exe
          path: dist/ShopeeLabelPrinter.exe
          retention-days: 90

      # Anexa o .exe à Release. Vale para os dois casos: tag nova enviada
      # (push) e Release publicada pelo site (release) — nos dois o github.ref
      # é a tag. No workflow_dispatch não há tag, e o passo é pulado.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShopeeLabelPrinter.exe
          draft: false
          prerelease: false
          generate_release_notes: true
